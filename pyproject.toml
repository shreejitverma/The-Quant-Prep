[project]
name = "the-quant-prep"
version = "0.1.0"
description = "Quant trader, researcher and developer interview curriculum with a progress-tracking CLI and dashboard."
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["_archive", "16-Trading-and-Investing", "SDE-Interview-Prep", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
filterwarnings = ["error"]

[tool.ruff.format]
exclude = ["*.md"]
