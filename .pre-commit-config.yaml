repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-emojis
        name: No Emojis
        entry: "[\U00010000-\U0010ffff]"
        language: pygrep
        types: [text]
        exclude: ^\.git/

  - repo: local
    hooks:
      - id: qp-check
        name: qp check (curriculum schema, links, style)
        entry: ./qp check
        language: system
        pass_filenames: false
        files: \.md$
