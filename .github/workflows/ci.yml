name: Quant Prep CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas pytest
        
    - name: Run Unit Tests
      run: |
        python -m pytest tests/
        
    - name: Verify C++ Examples
      run: |
        # memory_pool.cpp uses parenthesized aggregate initialization
        # (Order(int, double, int) on a struct with no ctor), which
        # requires C++20.
        g++ -std=c++20 -o memory_pool 06_quantitative_development/cpp_low_latency/examples/memory_pool.cpp
        ./memory_pool

    - name: Build and Run C++ Unit Tests
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror \
            -I 06_quantitative_development/cpp_low_latency/examples \
            tests/cpp/test_udp_receiver_mock.cpp \
            -o test_udp_receiver_mock
        ./test_udp_receiver_mock
