name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  content-and-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shreejitverma/SDE-Interview-Prep
          path: SDE-Interview-Prep
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Curriculum check (notes, cards, links, style, SDE links)
        env:
          SDE_REPO: ${{ github.workspace }}/SDE-Interview-Prep
          QP_HOME: ${{ runner.temp }}/qp
        run: ./qp check --strict-sde
      - name: Platform tests
        run: python -m unittest discover -s tools/tests -t .
      - name: Ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .
          ruff format --check .
      - name: Python examples run
        run: |
          python -m pip install numpy pandas
          python 09-Alpha-Research-and-Portfolio/code/simple_event_driven.py
          python 09-Alpha-Research-and-Portfolio/code/performance_metrics.py
          python 12-Quant-Development/code/python/itch_parser_mock.py

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the new commits for secrets
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$(printf %s "$BASE_SHA" | tr -d 0)" ]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          tools/scan-secrets.sh "$BASE_SHA"

  cpp-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build all examples warning-free
        working-directory: 12-Quant-Development/code/cpp
        run: |
          for f in *.cpp; do
            ${{ matrix.cxx }} -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -o "/tmp/${f%.cpp}" "$f"
          done
      - name: Run examples under sanitizers
        working-directory: 12-Quant-Development/code/cpp
        run: |
          for f in memory_pool compile_time_greeks order_matching_engine lock_free_spsc_queue multithreaded_monte_carlo; do
            ${{ matrix.cxx }} -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -o "/tmp/san_$f" "$f.cpp"
            "/tmp/san_$f"
          done
      - name: Run concurrent examples under ThreadSanitizer
        working-directory: 12-Quant-Development/code/cpp
        run: |
          for f in lock_free_spsc_queue multithreaded_monte_carlo; do
            ${{ matrix.cxx }} -std=c++20 -O1 -g -fsanitize=thread -pthread -o "/tmp/tsan_$f" "$f.cpp"
            "/tmp/tsan_$f"
          done
