# no-mistakes gate commands; CI (.github/workflows/ci.yml) runs the same checks.
# lint: curriculum schema, links, style; committed secrets; Python lint and format.
# test: platform tests.
commands:
  lint: './qp check && gitleaks dir . --no-banner --redact && ruff check . && ruff format --check .'
  test: 'python3 -m unittest discover -s tools/tests -t .'
