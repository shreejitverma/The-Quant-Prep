# Environment for the runnable examples and notebooks in the syllabus (section code/ folders).
# The qp platform itself needs only Python 3.10+ and no packages.
# Notebooks under _archive/ may need extra packages; install those per notebook.
name: quant_prep
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - statsmodels
  - scikit-learn
  - lightgbm
  - pytorch
  - matplotlib
  - seaborn
  - jupyterlab
  - yfinance
  - ruff
